<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 协同 AI 办公系统 (AOS)</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .form-control {
            border-radius: 5px;
            padding: 10px 15px;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h4 class="mb-0"><i class="bi bi-building me-2"></i>协同 AI 办公系统</h4>
            <p class="mb-0 mt-2"><small>XietongAI - AOS</small></p>
        </div>
        <div class="login-body">
            {% if form.errors %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>用户名或密码错误，请重试
            </div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">用户名/姓名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="请输入用户名或真实姓名" required>
                    </div>
                    <small class="form-text text-muted">
                        <i class="bi bi-info-circle"></i> 支持使用用户名、真实姓名或邮箱登录
                    </small>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>登录
                </button>
                
                <div class="text-center mt-3">
                    <a href="/forgot-password/" class="text-decoration-none">
                        <small>忘记密码？</small>
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
