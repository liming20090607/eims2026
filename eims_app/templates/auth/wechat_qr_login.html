<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码登录 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .qr-code-container {
            text-align: center;
            padding: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wechat_qr_container {
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }
        .status-text {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
            text-align: center;
        }
        .timer-text {
            margin-top: 10px;
            font-size: 14px;
            color: #999;
            text-align: center;
        }
        .btn-switch {
            margin-top: 20px;
        }
        .loading-spinner {
            display: none;
            margin: 20px auto;
        }
        .success-icon {
            display: none;
            font-size: 60px;
            color: #28a745;
            margin: 20px 0;
        }
        .wechat-logo {
            font-size: 48px;
            color: #07c160;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h4 class="mb-0"><i class="bi bi-wechat me-2"></i>微信扫码登录</h4>
            <p class="mb-0 mt-2"><small>使用微信扫描二维码快速登录</small></p>
        </div>
        <div class="login-body">
            <!-- 二维码显示区域 -->
            <div id="qrCodeArea">
                <div class="text-center">
                    <i class="bi bi-wechat wechat-logo"></i>
                </div>
                
                <div class="qr-code-container">
                    <!-- 微信二维码将在这里渲染 -->
                    <div id="wechat_qr_container"></div>
                </div>
                
                <div class="status-text" id="statusText">
                    <i class="bi bi-info-circle me-2"></i>请使用微信扫描二维码
                </div>
                
                <div class="timer-text" id="timerText">
                    <i class="bi bi-clock me-1"></i>二维码有效期：<span id="countdown">10:00</span>
                </div>
                
                <div class="text-center loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2 text-success">等待确认中...</p>
                </div>
                
                <div class="text-center success-icon" id="successIcon">
                    <i class="bi bi-check-circle-fill"></i>
                    <p class="mt-2">登录成功，正在跳转...</p>
                </div>
            </div>
            
            <!-- 切换登录方式 -->
            <div class="text-center btn-switch">
                <a href="/login/" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-key me-1"></i>使用账号密码登录
                </a>
            </div>
        </div>
    </div>

    <!-- 引入微信JS-SDK -->
    <script src="https://res.wx.qq.com/connect/zh_CN/htmledition/js/wxLogin.js"></script>
    
    <script>
        const sessionId = '{{ session_id }}';
        const state = '{{ state }}';
        let pollInterval;
        let countdownInterval;
        let timeLeft = 600; // 10分钟（秒）
        
        // 初始化微信二维码
        function initWechatQR() {
            if (typeof WxLogin !== 'undefined') {
                new WxLogin({
                    self_redirect: false,
                    id: "wechat_qr_container",
                    appid: "{{ app_id }}",
                    scope: "snsapi_login",
                    redirect_uri: encodeURIComponent("{{ redirect_uri }}"),
                    state: state,
                    style: "black",
                    href: ""
                });
            } else {
                document.getElementById('wechat_qr_container').innerHTML = 
                    '<div class="alert alert-warning">微信JS-SDK加载失败，请刷新页面重试</div>';
            }
        }
        
        // 开始倒计时
        function startCountdown() {
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('statusText').innerHTML = 
                        '<i class="bi bi-exclamation-triangle text-danger me-2"></i>二维码已过期，请刷新页面重新获取';
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('countdown').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // 轮询检查登录状态
        function checkLoginStatus() {
            fetch(`/wechat-login/status/${sessionId}/`)
                .then(response => response.json())
                .then(data => {
                    console.log('Status:', data.status);
                    
                    if (data.status === 'bound') {
                        // 已绑定并登录，停止轮询
                        clearInterval(pollInterval);
                        clearInterval(countdownInterval);
                        
                        // 显示成功图标
                        document.getElementById('wechat_qr_container').style.display = 'none';
                        document.getElementById('statusText').style.display = 'none';
                        document.getElementById('timerText').style.display = 'none';
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('successIcon').style.display = 'block';
                        
                        // 跳转到首页
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                        
                    } else if (data.status === 'expired' || data.status === 'cancelled') {
                        // 已过期或已取消
                        clearInterval(pollInterval);
                        clearInterval(countdownInterval);
                        
                        document.getElementById('statusText').innerHTML = 
                            `<i class="bi bi-exclamation-triangle text-danger me-2"></i>${data.message || '二维码已失效'}`;
                    } else if (data.status === 'authorized') {
                        // 已授权但未绑定
                        document.getElementById('statusText').innerHTML = 
                            '<i class="bi bi-hourglass-split text-warning me-2"></i>已扫码，请在手机上完成授权';
                        document.getElementById('loadingSpinner').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error checking status:', error);
                });
        }
        
        // 页面加载完成后开始
        document.addEventListener('DOMContentLoaded', () => {
            initWechatQR();
            startCountdown();
            
            // 每2秒检查一次状态
            pollInterval = setInterval(checkLoginStatus, 2000);
            
            // 立即检查一次
            checkLoginStatus();
        });
        
        // 页面关闭时清理定时器
        window.addEventListener('beforeunload', () => {
            clearInterval(pollInterval);
            clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
