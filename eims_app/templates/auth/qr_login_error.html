<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录错误 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px;
        }
        .error-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bi bi-x-circle-fill error-icon"></i>
        <h4>{{ message|default:"登录失败" }}</h4>
        <p class="text-muted mt-3">请重试或使用账号密码登录</p>
        <div class="mt-4">
            <a href="/login/" class="btn btn-primary me-2">
                <i class="bi bi-key me-2"></i>账号密码登录
            </a>
            <a href="/" class="btn btn-outline-secondary">
                <i class="bi bi-house me-2"></i>返回首页
            </a>
        </div>
    </div>
</body>
</html>
