<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .forgot-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .forgot-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .forgot-body {
            padding: 30px;
        }
        .step-indicator {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .step-progress {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .step-progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transition: width 0.3s ease;
        }
        .step-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #6c757d;
        }
        .btn-reset {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-reset:hover {
            opacity: 0.9;
        }
        .success-icon {
            font-size: 80px;
            color: #28a745;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="forgot-card">
        <div class="forgot-header">
            <h4 class="mb-0"><i class="bi bi-key me-2"></i>忘记密码</h4>
            <p class="mb-0 mt-2"><small>通过手机验证码重置密码</small></p>
        </div>
        <div class="forgot-body">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-progress">
                    <div class="step-progress-bar" id="progressBar" style="width: 33%;"></div>
                </div>
                <div class="step-text" id="stepText">步骤 1/3: 验证手机号</div>
            </div>
            
            <!-- 步骤 1: 输入手机号 -->
            <div id="step1">
                <h5 class="mb-3"><i class="bi bi-phone me-2"></i>输入绑定的手机号</h5>
                <form id="phoneForm">
                    <div class="mb-3">
                        <label for="phone" class="form-label">手机号 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-phone"></i></span>
                            <input type="text" class="form-control" id="phone" 
                                   placeholder="请输入绑定的手机号" required maxlength="11">
                        </div>
                        <small class="form-text text-muted">
                            <i class="bi bi-info-circle"></i> 输入您账号绑定的手机号
                        </small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-reset btn-lg">
                            <i class="bi bi-send me-2"></i>获取验证码
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- 步骤 2: 输入验证码和新密码 -->
            <div id="step2" style="display: none;">
                <h5 class="mb-3"><i class="bi bi-shield-check me-2"></i>验证并设置新密码</h5>
                <form id="verifyForm">
                    <input type="hidden" id="verifyPhone">
                    
                    <div class="mb-3">
                        <label for="smsCode" class="form-label">短信验证码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="text" class="form-control" id="smsCode" 
                                   placeholder="请输入短信验证码" required maxlength="6">
                            <button class="btn btn-outline-secondary" type="button" id="resendBtn" disabled>
                                重新发送 (<span id="countdown">60</span>)
                            </button>
                        </div>
                        <small class="form-text text-muted">
                            <i class="bi bi-info-circle"></i> 验证码已发送到您的手机，有效期 5 分钟
                        </small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">新密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="newPassword" 
                                   placeholder="请输入新密码" required minlength="6">
                        </div>
                        <small class="form-text text-muted">
                            <i class="bi bi-info-circle"></i> 密码长度至少 6 位
                        </small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">确认密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" 
                                   placeholder="请再次输入新密码" required minlength="6">
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-reset btn-lg">
                            <i class="bi bi-check-circle me-2"></i>重置密码
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- 步骤 3: 完成 -->
            <div id="step3" style="display: none;">
                <div class="success-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h4 class="text-center">密码重置成功！</h4>
                <p class="text-muted text-center">请使用新密码重新登录</p>
                <div class="d-grid gap-2 mt-4">
                    <a href="/login/" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>去登录
                    </a>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="/login/" class="text-muted">
                    <i class="bi bi-arrow-left me-1"></i>返回登录
                </a>
            </div>
        </div>
    </div>

    <script>
        let countdownTimer;
        const CODE_EXPIRE_TIME = 60; // 60 秒
        
        // 步骤 1: 发送验证码
        document.getElementById('phoneForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            
            fetch('/api/forgot-password/send-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    phone: phone
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 显示步骤 2
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('verifyPhone').value = phone;
                    updateProgress(66, '步骤 2/3: 验证并重置');
                    
                    // 开始倒计时
                    startCountdown();
                    
                    alert('验证码已发送，请注意查收短信');
                } else {
                    alert('发送失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('发送失败，请重试');
            });
        });
        
        // 步骤 2: 验证并重设密码
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('verifyPhone').value;
            const code = document.getElementById('smsCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 验证密码一致性
            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            fetch('/api/forgot-password/verify-reset/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    phone: phone,
                    code: code,
                    new_password: newPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 显示步骤 3
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                    updateProgress(100, '完成');
                } else {
                    alert('重置失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('重置失败，请重试');
            });
        });
        
        // 重新发送验证码
        document.getElementById('resendBtn').addEventListener('click', function() {
            const phone = document.getElementById('verifyPhone').value;
            
            fetch('/api/forgot-password/send-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    phone: phone
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('验证码已重新发送');
                    startCountdown();
                } else {
                    alert('发送失败：' + data.message);
                }
            });
        });
        
        // 更新进度条
        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('stepText').innerText = text;
        }
        
        // 倒计时函数
        function startCountdown() {
            let seconds = CODE_EXPIRE_TIME;
            const countdownElement = document.getElementById('countdown');
            const resendButton = document.getElementById('resendBtn');
            
            resendButton.disabled = true;
            
            countdownTimer = setInterval(function() {
                seconds--;
                countdownElement.innerText = seconds;
                
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    resendButton.disabled = false;
                    resendButton.innerText = '重新发送';
                }
            }, 1000);
        }
        
        // 获取CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
