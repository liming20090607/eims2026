<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认登录 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
        }
        .confirm-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .confirm-body {
            padding: 30px;
        }
        .user-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-confirm:hover {
            opacity: 0.9;
        }
        .btn-cancel {
            border: 2px solid #dc3545;
            color: #dc3545;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-cancel:hover {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="confirm-card">
        <div class="confirm-header">
            <h4 class="mb-0"><i class="bi bi-shield-check me-2"></i>确认登录</h4>
            <p class="mb-0 mt-2"><small>请确认是否允许电脑端登录</small></p>
        </div>
        <div class="confirm-body">
            <!-- 用户信息 -->
            <div class="user-info text-center">
                <div class="user-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h5 class="mb-1">{{ user.get_full_name|default:user.username }}</h5>
                <p class="text-muted mb-0">@{{ user.username }}</p>
                {% if user.email %}
                <p class="text-muted small mb-0">{{ user.email }}</p>
                {% endif %}
            </div>
            
            <!-- 提示信息 -->
            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                确认后，电脑端将自动完成登录
            </div>
            
            <!-- 操作按钮 -->
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary btn-confirm" onclick="confirmLogin()">
                    <i class="bi bi-check-circle me-2"></i>确认登录
                </button>
                <button type="button" class="btn btn-outline-danger btn-cancel" onclick="cancelLogin()">
                    <i class="bi bi-x-circle me-2"></i>取消
                </button>
            </div>
        </div>
    </div>

    <script>
        const sessionId = '{{ session.session_id }}';
        
        // 确认登录
        function confirmLogin() {
            if (!confirm('确认允许电脑端以您的身份登录？')) {
                return;
            }
            
            const formData = new FormData();
            formData.append('session_id', sessionId);
            
            fetch('/qr-login/confirm/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 显示成功消息
                    document.querySelector('.confirm-body').innerHTML = `
                        <div class="text-center">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 80px;"></i>
                            <h4 class="mt-3">确认成功！</h4>
                            <p class="text-muted">电脑端正在自动登录...</p>
                            <p class="small text-muted mt-3">您可以关闭此页面</p>
                        </div>
                    `;
                    
                    // 3秒后可以选择关闭或返回
                    setTimeout(() => {
                        if (confirm('登录已完成，是否返回首页？')) {
                            window.location.href = '/';
                        }
                    }, 3000);
                } else {
                    alert('确认失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('网络错误，请重试');
            });
        }
        
        // 取消登录
        function cancelLogin() {
            if (!confirm('确定要取消本次登录吗？')) {
                return;
            }
            
            const formData = new FormData();
            formData.append('session_id', sessionId);
            
            fetch('/qr-login/cancel/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.querySelector('.confirm-body').innerHTML = `
                        <div class="text-center">
                            <i class="bi bi-x-circle-fill text-secondary" style="font-size: 80px;"></i>
                            <h4 class="mt-3">已取消</h4>
                            <p class="text-muted">登录已取消</p>
                            <a href="/" class="btn btn-outline-primary mt-3">
                                <i class="bi bi-house me-2"></i>返回首页
                            </a>
                        </div>
                    `;
                } else {
                    alert('取消失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('网络错误，请重试');
            });
        }
        
        // 获取CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
