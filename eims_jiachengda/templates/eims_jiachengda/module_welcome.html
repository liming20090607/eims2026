{% extends 'base/base.html' %}
{% load static %}

{% block title %}{{ module_name }} - 协同AI办公系统{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body text-center py-5">
                    <!-- 图标 -->
                    <div class="mb-4">
                        <i class="bi bi-tools" style="font-size: 5rem; color: #6c757d;"></i>
                    </div>
                    
                    <!-- 标题 -->
                    <h2 class="card-title mb-3 fw-bold text-primary">{{ module_name }}</h2>
                    
                    <!-- 副标题 -->
                    <p class="text-muted mb-4 fs-5">模块建设中</p>
                    
                    <!-- 提示信息 -->
                    <div class="alert alert-info mb-4" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <strong>欢迎定制开发，敬请咨询！</strong>
                    </div>
                    
                    <!-- 描述文字 -->
                    <p class="text-secondary mb-4">
                        该模块正在规划中，如需定制开发此功能，请联系我们的技术团队。
                        我们将根据您的业务需求，提供专业的解决方案和技术支持。
                    </p>
                    
                    <!-- 返回按钮 -->
                    <a href="{% url 'eims_jiachengda:eims_index' %}" class="btn btn-primary btn-lg px-5">
                        <i class="bi bi-house-door me-2"></i>返回首页
                    </a>
                </div>
            </div>
            
            <!-- 联系信息卡片 -->
            <div class="card mt-4 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        <i class="bi bi-headset text-primary me-2"></i>联系我们
                    </h5>
                    <p class="card-text text-muted mb-2">
                        <i class="bi bi-envelope me-2"></i>邮箱：contact@example.com
                    </p>
                    <p class="card-text text-muted mb-0">
                        <i class="bi bi-telephone me-2"></i>电话：400-XXX-XXXX
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
