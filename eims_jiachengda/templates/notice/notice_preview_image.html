{% extends 'base/base.html' %}
{% load static %}

{% block title %}文件预览 - {{ notice.notice_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <!-- 页面标题 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-image me-2"></i>图片预览
                </h2>
                <a href="{{ back_url }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回列表
                </a>
            </div>

            <!-- 图片预览 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-file-earmark-image me-2"></i>{{ file_name }}
                    </h5>
                </div>
                <div class="card-body text-center bg-light">
                    <img src="{{ file_url }}" 
                         alt="{{ file_name }}" 
                         class="img-fluid" 
                         style="max-width: 100%; max-height: 80vh;">
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>文件信息：</strong>
                            <span class="ms-2">大小：{{ notice.file_size|filesizeformat }}</span>
                            <span class="ms-3">类型：{{ file_type|upper }}</span>
                            <span class="ms-3">上传人：{{ notice.upload_person|default:'-' }}</span>
                        </div>
                        <div>
                            <a href="{% url 'eims_app:notice_file_download' notice.id %}?file={{ attachment.id|default:'' }}" 
                               class="btn btn-success btn-sm">
                                <i class="bi bi-download me-1"></i>下载
                            </a>
                            <a href="{{ back_url }}" class="btn btn-secondary btn-sm">
                                <i class="bi bi-x-lg me-1"></i>关闭
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
