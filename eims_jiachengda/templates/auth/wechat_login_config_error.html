<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置错误 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 40px;
        }
        .error-icon {
            font-size: 80px;
            color: #ffc107;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bi bi-gear-fill error-icon"></i>
        <h4>{{ message|default:"功能未配置" }}</h4>
        <p class="text-muted mt-3">此功能需要管理员配置后才能使用</p>
        
        <div class="alert alert-warning mt-4 text-start">
            <h6><i class="bi bi-info-circle me-2"></i>配置说明：</h6>
            <ol class="mb-0 ps-3">
                <li>访问 <a href="https://open.weixin.qq.com/" target="_blank">微信开放平台</a> 注册账号</li>
                <li>创建网站应用，获取AppID和AppSecret</li>
                <li>在系统设置中配置微信开放平台参数</li>
                <li>设置授权回调域名</li>
            </ol>
        </div>
        
        <div class="mt-4">
            <a href="/login/" class="btn btn-primary me-2">
                <i class="bi bi-key me-2"></i>返回登录
            </a>
            <a href="/" class="btn btn-outline-secondary">
                <i class="bi bi-house me-2"></i>返回首页
            </a>
        </div>
    </div>
</body>
</html>
