<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等待确认 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .waiting-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px;
        }
        .waiting-icon {
            font-size: 80px;
            color: #ffc107;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="waiting-card">
        <i class="bi bi-hourglass-split waiting-icon"></i>
        <h4>{{ message|default:"等待确认中..." }}</h4>
        <p class="text-muted mt-3">请在手机上确认登录</p>
        <div class="spinner-border text-primary mt-3" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>
</body>
</html>
