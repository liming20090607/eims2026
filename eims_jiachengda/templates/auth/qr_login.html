<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码登录 - 协同 AI 办公系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .qr-code-container {
            text-align: center;
            padding: 20px;
        }
        .qr-code-img {
            max-width: 250px;
            margin: 0 auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
        }
        .status-text {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
        }
        .timer-text {
            margin-top: 10px;
            font-size: 14px;
            color: #999;
        }
        .btn-switch {
            margin-top: 20px;
        }
        .loading-spinner {
            display: none;
            margin: 20px auto;
        }
        .success-icon {
            display: none;
            font-size: 60px;
            color: #28a745;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h4 class="mb-0"><i class="bi bi-qr-code-scan me-2"></i>扫码登录</h4>
            <p class="mb-0 mt-2"><small>使用手机扫描二维码快速登录</small></p>
        </div>
        <div class="login-body">
            <!-- 二维码显示区域 -->
            <div id="qrCodeArea">
                <div class="qr-code-container">
                    <img src="{{ qr_code_img }}" alt="登录二维码" class="qr-code-img" id="qrCodeImg">
                </div>
                
                <div class="status-text" id="statusText">
                    <i class="bi bi-info-circle me-2"></i>请使用手机扫描二维码
                </div>
                
                <div class="timer-text" id="timerText">
                    <i class="bi bi-clock me-1"></i>二维码有效期：<span id="countdown">10:00</span>
                </div>
                
                <div class="text-center loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">等待确认中...</p>
                </div>
                
                <div class="text-center success-icon" id="successIcon">
                    <i class="bi bi-check-circle-fill"></i>
                    <p class="mt-2">登录成功，正在跳转...</p>
                </div>
            </div>
            
            <!-- 切换登录方式 -->
            <div class="text-center btn-switch">
                <a href="/login/" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-key me-1"></i>使用账号密码登录
                </a>
            </div>
        </div>
    </div>

    <script>
        const sessionId = '{{ session_id }}';
        let pollInterval;
        let countdownInterval;
        let timeLeft = 600; // 10分钟（秒）
        
        // 开始倒计时
        function startCountdown() {
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('statusText').innerHTML = 
                        '<i class="bi bi-exclamation-triangle text-danger me-2"></i>二维码已过期，请刷新页面重新获取';
                    document.getElementById('qrCodeImg').style.opacity = '0.3';
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('countdown').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // 轮询检查登录状态
        function checkLoginStatus() {
            fetch(`/qr-login/status/${sessionId}/`)
                .then(response => response.json())
                .then(data => {
                    console.log('Status:', data.status);
                    
                    if (data.status === 'confirmed') {
                        // 已确认，停止轮询
                        clearInterval(pollInterval);
                        clearInterval(countdownInterval);
                        
                        // 显示成功图标
                        document.getElementById('qrCodeImg').style.display = 'none';
                        document.getElementById('statusText').style.display = 'none';
                        document.getElementById('timerText').style.display = 'none';
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('successIcon').style.display = 'block';
                        
                        // 跳转到完成登录页面
                        setTimeout(() => {
                            window.location.href = `/qr-login/complete/${sessionId}/`;
                        }, 1500);
                        
                    } else if (data.status === 'expired' || data.status === 'cancelled') {
                        // 已过期或已取消
                        clearInterval(pollInterval);
                        clearInterval(countdownInterval);
                        
                        document.getElementById('statusText').innerHTML = 
                            `<i class="bi bi-exclamation-triangle text-danger me-2"></i>${data.message || '二维码已失效'}`;
                        document.getElementById('qrCodeImg').style.opacity = '0.3';
                    } else if (data.status === 'scanned') {
                        // 已扫码但未确认
                        document.getElementById('statusText').innerHTML = 
                            '<i class="bi bi-hourglass-split text-warning me-2"></i>已扫码，请在手机上确认登录';
                        document.getElementById('loadingSpinner').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error checking status:', error);
                });
        }
        
        // 页面加载完成后开始
        document.addEventListener('DOMContentLoaded', () => {
            startCountdown();
            
            // 每2秒检查一次状态
            pollInterval = setInterval(checkLoginStatus, 2000);
            
            // 立即检查一次
            checkLoginStatus();
        });
        
        // 页面关闭时清理定时器
        window.addEventListener('beforeunload', () => {
            clearInterval(pollInterval);
            clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
